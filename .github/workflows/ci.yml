name: Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run for the same branch or pull request cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # The whole check on every supported Java; 21 and 25 add Error Prone, NullAway
  # and the formatting check. No service stack: the live suites run against a
  # private stack. The client resolves from Maven Central at the exact version
  # pom.xml names, so it must be published before this build can pass.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: java -version
      - run: ./mvnw -B -ntp verify
