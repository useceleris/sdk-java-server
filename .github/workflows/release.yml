name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

# A release upload must never be cancelled by a newer dispatch. The Central Portal
# deployment remains available for a maintainer to inspect and publish manually.
concurrency:
  group: java-server-release
  cancel-in-progress: false

jobs:
  release-versions:
    # A production release always starts from the reviewed release branch.
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Reject snapshot server and client versions
        shell: bash
        run: |
          for expression in project.version celeris-client.version; do
            version="$(./mvnw -q -ntp help:evaluate -Dexpression="$expression" -DforceStdout)"
            case "$version" in
              *-SNAPSHOT)
                echo "$expression is $version, a snapshot. Set release versions first."
                exit 1
                ;;
            esac
          done

  # Keep the release gated by every check that protects ordinary changes.
  verify:
    if: github.ref == 'refs/heads/release'
    needs: release-versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: java -version
      - run: ./mvnw -B -ntp verify

  release:
    # A maintainer starts this workflow manually, from the release branch only.
    if: github.ref == 'refs/heads/release'
    needs: [release-versions, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_TOKEN_USERNAME
          server-password-env-var: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: GPG_PASSPHRASE

      # The release profile signs the artifacts and uploads a deployment. Its
      # autoPublish setting remains false, so publishing in Central Portal is a
      # deliberate manual approval after validation.
      - name: Build, sign, and upload to Central Portal
        run: ./mvnw -B -ntp -Prelease clean deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
